# Redeploys weekly so the TMDB-query-defined lists (ADR 0001) track TMDB's
# current ratings without anyone remembering to run anything. The data is
# fetched while the site builds (prerendering), and assertPlayableLists gates
# it: a bad refresh fails the build here instead of shipping an unplayable
# list — the previous deploy stays live.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TMDB_API_KEY          — free key from themoviedb.org/settings/api
#   CLOUDFLARE_API_TOKEN  — token with Workers edit permission, for the deploy
#   PUBLIC_POSTHOG_KEY    — PostHog project API key; baked into the bundle at
#                           build time, so the weekly rebuild needs it too or
#                           the refresh would quietly ship analytics turned off

name: Refresh movie data

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Shared with the deploy job in ci.yml so two deploys never race.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
