# Every push and PR is linted, type-checked, tested, and built; pushes to main
# additionally deploy to Cloudflare Workers once those checks pass.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TMDB_API_KEY          — free key from themoviedb.org/settings/api; the build
#                           prerenders every page from TMDB data (ADR 0001)
#   CLOUDFLARE_API_TOKEN  — Cloudflare token with Workers edit permission
#                           (dash.cloudflare.com → My Profile → API Tokens →
#                           "Edit Cloudflare Workers" template)

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      # The build prerenders every page, fetching the movie lists from TMDB
      # (ADR 0001) and failing on an unplayable list — so it needs the key.
      - run: npm run build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    # Shared with refresh-data.yml so two deploys never race; queued, not
    # cancelled, so the newest push still ships.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run deploy` rebuilds (the artifact from the check job isn't
      # reused — a fresh prerender against TMDB is the point) and ships with
      # wrangler.
      - run: npm run deploy
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
