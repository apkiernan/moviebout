<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d161f"/>
      <stop offset="1" stop-color="#150507"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f0dd"/>
      <stop offset="1" stop-color="#e4d3b2"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cf2e3e"/>
      <stop offset="1" stop-color="#8f1d2c"/>
    </linearGradient>
    <clipPath id="ticket-clip">
      <rect x="86" y="156" width="340" height="200" rx="20"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="86" fill="none" stroke="#b9862c" stroke-width="8"/>

  <!-- marquee bulbs -->
  <g fill="#f2c14e">
    <circle cx="106" cy="62" r="10"/>
    <circle cx="181" cy="62" r="10"/>
    <circle cx="256" cy="62" r="10"/>
    <circle cx="331" cy="62" r="10"/>
    <circle cx="406" cy="62" r="10"/>
    <circle cx="106" cy="450" r="10"/>
    <circle cx="181" cy="450" r="10"/>
    <circle cx="256" cy="450" r="10"/>
    <circle cx="331" cy="450" r="10"/>
    <circle cx="406" cy="450" r="10"/>
  </g>

  <!-- ticket stub -->
  <g transform="rotate(-7 256 256)">
    <g clip-path="url(#ticket-clip)">
      <rect x="86" y="156" width="340" height="200" fill="url(#paper)"/>
      <rect x="86" y="156" width="64" height="200" fill="url(#stripe)"/>
      <line x1="162" y1="168" x2="162" y2="344" stroke="#241318" stroke-opacity="0.35" stroke-width="5" stroke-dasharray="3 14" stroke-linecap="round"/>
    </g>
    <text x="292" y="248" text-anchor="middle" font-family="Anton, Impact, 'Arial Narrow', sans-serif" font-size="56" letter-spacing="4" fill="#241318">ADMIT</text>
    <text x="292" y="316" text-anchor="middle" font-family="Anton, Impact, 'Arial Narrow', sans-serif" font-size="56" letter-spacing="4" fill="#cf2e3e">ONE</text>
  </g>
</svg>
